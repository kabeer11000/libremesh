name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push peerhost
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./peerhost/Dockerfile
          push: true
          tags: |
            ghcr.io/imossaidqadri/libremesh/peerhost:latest
            ghcr.io/imossaidqadri/libremesh/peerhost:${{ steps.version.outputs.VERSION }}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/imossaidqadri/libremesh/gateway:latest
            ghcr.io/imossaidqadri/libremesh/gateway:${{ steps.version.outputs.VERSION }}

      - name: Build and push meshdrop
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./meshdrop/Dockerfile
          push: true
          tags: |
            ghcr.io/imossaidqadri/libremesh/meshdrop:latest
            ghcr.io/imossaidqadri/libremesh/meshdrop:${{ steps.version.outputs.VERSION }}

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get changelog content
        id: changelog
        run: |
          CONTENT=$(cat CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}